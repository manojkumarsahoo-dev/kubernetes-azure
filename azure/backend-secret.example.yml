# TEMPLATE ONLY - do not commit real values.
# Preferred: run scripts/create-backend-secret.sh, which builds this Secret
# from the MySQL host (looked up with az) and your passwords without writing them to disk.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: microservices
type: Opaque
stringData:
  DB_HOST: "<MySQL server FQDN, e.g. mysql-veeraops-xxxxx.mysql.database.azure.com>"
  DB_USER: "shopadmin"
  DB_PASSWORD: "<the MYSQL_ADMIN_PASSWORD you chose>"
  MAIL_USERNAME: "<your gmail address>"
  MAIL_PASSWORD: "<your gmail app password>"
